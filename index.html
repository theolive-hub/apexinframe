<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InFrame × Apex</title>
<style>
  :root{--ink:#111318;--paper:#fff;--mist:#f5f6f8;--line:#e4e6ea;--muted:#6b7280;--accent:#158b7d}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:var(--mist);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
  .screen{width:100%;max-width:560px;text-align:center;display:none}
  .mark{font-size:24px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
  .mark span{font-weight:300;color:var(--muted)}
  .tag{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:34px}
  .tools{display:grid;gap:14px}
  .toolcard{display:flex;align-items:center;justify-content:space-between;gap:14px;text-decoration:none;color:inherit;
    background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px;text-align:left;transition:border-color .15s,transform .05s}
  .toolcard:hover{border-color:var(--ink)}.toolcard:active{transform:scale(.99)}
  .toolcard .t{font-size:16px;font-weight:700}
  .toolcard .d{font-size:13px;color:var(--muted);margin-top:2px}
  .toolcard .go{font-size:22px;color:var(--accent);flex:none}
  .foot{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:34px}
  .offbig{font-size:32px;font-weight:700;letter-spacing:.02em;margin:22px 0 12px}
  .offmsg{font-size:14px;color:var(--muted);line-height:1.6;max-width:420px;margin:0 auto}
</style>
<script src="config.js"></script>
</head>
<body>
  <div class="screen" id="home">
    <div class="mark">InFrame <span>× Apex</span></div>
    <div class="tag">Internal Tools</div>
    <div class="tools">
      <a class="toolcard" href="pricingtool/">
        <div>
          <div class="t">Price Calculator</div>
          <div class="d">Build a project pricing profile from OUT / IN dates.</div>
        </div>
        <div class="go" aria-hidden="true">&rarr;</div>
      </a>
    </div>
    <div class="foot">InFrame × Apex — Partnership Tools</div>
  </div>
  <div class="screen" id="coming">
    <div class="mark">InFrame <span>× Apex</span></div>
    <div class="tag">Partnership Tools</div>
    <div class="offbig">Coming Soon</div>
    <div class="offmsg">We're putting the finishing touches on things. Check back shortly.</div>
  </div>
<script>
  var ON=(window.APP_CONFIG&&typeof window.APP_CONFIG.online==="boolean")?window.APP_CONFIG.online:true;
  document.getElementById(ON?"home":"coming").style.display="block";
</script>
</body>
</html>
